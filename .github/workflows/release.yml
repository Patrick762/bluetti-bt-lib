# Build the distribution and publish it as a GitHub Release asset.
#
# Triggered by pushing a version tag (e.g. `v1.0.0`). The workflow builds the
# wheel + sdist, then creates (or updates) the matching GitHub Release and
# attaches the built artifacts to it. Home Assistant integrations installed via
# HACS can then pin their `requirements` to a stable release asset URL instead
# of a moving branch, which makes the download reproducible and reliable.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        env:
          # Strip the leading `v` so the package version stays PEP 440 compliant
          # (tag `v1.0.0` -> version `1.0.0`).
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          LIB_VERSION="${GITHUB_REF_NAME#v}" python -m build

      - name: Create GitHub release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "${{ github.ref_name }}" \
              dist/*.whl dist/*.tar.gz \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
